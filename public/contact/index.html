    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Jack Miller Media",
        "url": "https://jackmillermedia.com/contact/",

    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(180deg, #070910, #131012 50%, #070910); color: #f5f7fb; }
      main { width: min(960px, calc(100vw - 32px)); margin: 0 auto; padding: 48px 0 72px; }
      .card { border: 1px solid rgba(255,255,255,.14); border-radius: 24px; padding: clamp(24px, 4vw, 44px); background: rgba(12,10,12,.8); box-shadow: 0 24px 60px rgba(0,0,0,.32); }
      .eyebrow { margin: 0 0 12px; color: #f0d8ad; text-transform: uppercase; letter-spacing: .22em; font-size: .74rem; }
      h1 { margin: 0; font-size: clamp(2.4rem, 6vw, 4.8rem); line-height: .95; }
      p { color: rgba(245,247,251,.78); line-height: 1.75; font-size: 1rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      .btn { display: inline-block; padding: 12px 16px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(240,216,173,.42); color: #f5f7fb; }
      .btn.secondary { border-color: rgba(255,255,255,.18); }
    </style>

  <body>
    <main>
      <section class="card">
        <p class="eyebrow">Contact</p>
        <h1>Get in touch</h1>
        <p>
          Jack Miller Media is available for selected creative collaborations in film,
          photography, videography, and visual storytelling. For the latest work and updates,
          use the main portfolio or reach out through the active social channels below.
        </p>
        <div class="actions">
          <a class="btn" href="https://www.instagram.com/jackmillermedia/">Instagram</a>
          <a class="btn secondary" href="https://www.youtube.com/@jackmillermedia">YouTube</a>
          <a class="btn secondary" href="https://jackmillermedia.com/">Main portfolio</a>
        </div>
      </section>
    </main>
  </body>
</html>
