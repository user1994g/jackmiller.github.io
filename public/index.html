    <script type="text/javascript">
      (function () {
        function rootHasContent() {
          var root = document.getElementById('root');
          return !!(root && root.children && root.children.length > 0);
        }

        function getMainScriptSrc() {
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i += 1) {
            var src = scripts[i].getAttribute('src');
            if (src && src.indexOf('/static/js/main.') !== -1) {
              return src;
            }
          }
          return null;
        }

        function showRecoveryHint(mainSrc) {
          if (document.getElementById('jack-boot-hint')) {
            return;
          }

          var hint = document.createElement('div');
          hint.id = 'jack-boot-hint';
          hint.style.position = 'fixed';
          hint.style.left = '50%';
          hint.style.bottom = '20px';
          hint.style.transform = 'translateX(-50%)';
          hint.style.zIndex = '99999';
          hint.style.padding = '10px 12px';
          hint.style.border = '1px solid rgba(255,255,255,0.28)';
          hint.style.borderRadius = '10px';
          hint.style.background = 'rgba(10,12,16,0.95)';
          hint.style.color = '#f2f4f8';
          hint.style.fontFamily = 'Arial, sans-serif';
          hint.style.fontSize = '13px';
          hint.style.maxWidth = 'calc(100vw - 24px)';
          hint.style.textAlign = 'center';

          var msg = document.createElement('span');
          msg.textContent = 'Page is taking longer than expected. ';

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Reload';
          btn.style.marginLeft = '6px';
          btn.style.padding = '4px 8px';
          btn.style.border = '1px solid rgba(255,255,255,0.3)';
          btn.style.borderRadius = '8px';
          btn.style.background = 'rgba(255,255,255,0.08)';
          btn.style.color = '#fff';
          btn.style.cursor = 'pointer';
          btn.onclick = function () {
            if (mainSrc) {
              var separator = window.location.href.indexOf('?') === -1 ? '?' : '&';
              window.location.replace(window.location.href + separator + 'v=' + String(Date.now()));
              return;
            }
            window.location.reload();
          };

          hint.appendChild(msg);
          hint.appendChild(btn);
          document.body.appendChild(hint);
        }

        window.__jackMarkBooted = function () {
          window.__jackAppBooted = true;
          var hint = document.getElementById('jack-boot-hint');
          if (hint && hint.parentNode) {
            hint.parentNode.removeChild(hint);
          }
        };

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (window.__jackAppBooted || rootHasContent()) {
              return;
            }

            var mainSrc = getMainScriptSrc();
            if (!mainSrc) {
              showRecoveryHint(null);
              return;
            }

            var retryScript = document.createElement('script');
            retryScript.defer = true;
            retryScript.src = mainSrc + (mainSrc.indexOf('?') === -1 ? '?v=' : '&v=') + String(Date.now());
            document.head.appendChild(retryScript);

            window.setTimeout(function () {
              if (!window.__jackAppBooted && !rootHasContent()) {
                showRecoveryHint(mainSrc);
              }
            }, 2800);
          }, 8000);
        });
      })();
    </script>

    <title>Jack Miller Portfolio | Film & Photography</title>
