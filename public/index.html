      (function () {
        function injectClarity() {

          var hostname = window.location.hostname.toLowerCase();
          if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1') {

          window.__jackClarityLoaded = true;
          window.clarity = window.clarity || function () {
            (window.clarity.q = window.clarity.q || []).push(arguments);

          var script = document.createElement('script');
          script.async = true;

          document.head.appendChild(script);
        }

        if (document.readyState === 'complete') {
          window.setTimeout(injectClarity, 1800);

        }, { once: true });
      })();

    <script type="text/javascript">
      (function () {
        var recoveryPromise = null;

        function rootHasContent() {
          var root = document.getElementById('root');
          return !!(root && root.children && root.children.length > 0);
        }

        function findBuildAsset(doc, selector, attribute, fragment) {
          var nodes = doc.querySelectorAll(selector);
          for (var i = 0; i < nodes.length; i += 1) {
            var value = nodes[i].getAttribute(attribute);
            if (value && value.indexOf(fragment) !== -1) {
              return value;
            }
          }
          return null;
        }

        function isSafeBuildAsset(asset, directory, extension) {
          if (!asset) {
            return false;
          }

          var url = new URL(asset, window.location.origin);
          var pattern = new RegExp('^/static/' + directory + '/main\\.[A-Za-z0-9]+\\.' + extension + '$');
          return url.origin === window.location.origin && pattern.test(url.pathname);
        }

        function appendStylesheet(href) {
          if (!isSafeBuildAsset(href, 'css', 'css')) {
            return;
          }

          var links = document.querySelectorAll('link[rel="stylesheet"]');
          var targetUrl = new URL(href, window.location.origin).href;
          for (var i = 0; i < links.length; i += 1) {
            if (new URL(links[i].href, window.location.origin).href === targetUrl) {
              return;
            }
          }

          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          document.head.appendChild(link);
        }

        function loadScript(src) {
          return new Promise(function (resolve) {
            if (!isSafeBuildAsset(src, 'js', 'js')) {
              resolve(false);
              return;
            }

            var script = document.createElement('script');
            script.async = false;
            script.src = src;
            script.onload = function () {
              resolve(true);
            };
            script.onerror = function () {
              resolve(false);
            };
            document.head.appendChild(script);
          });
        }

        function recoverCurrentBuild() {
          if (recoveryPromise) {
            return recoveryPromise;
          }

          var probePath = '/__boot-recovery/' + String(Date.now()) + '-' + Math.random().toString(36).slice(2) + '.html';
          recoveryPromise = fetch(probePath, {
            cache: 'no-store',
            headers: { Accept: 'text/html' }
          })
            .then(function (response) {
              return response.text();
            })
            .then(function (html) {
              var recoveryDoc = new DOMParser().parseFromString(html, 'text/html');
              var currentScript = findBuildAsset(recoveryDoc, 'script[src]', 'src', '/static/js/main.');
              var currentStylesheet = findBuildAsset(recoveryDoc, 'link[href]', 'href', '/static/css/main.');

              if (!isSafeBuildAsset(currentScript, 'js', 'js')) {
                return false;
              }

              appendStylesheet(currentStylesheet);
              return loadScript(currentScript);
            })
            .catch(function () {
              return false;
            });

          return recoveryPromise;
        }

        function finishRecovery(started) {
          if (!started) {
            showRecoveryHint();
            return;
          }

          window.setTimeout(function () {
            if (!window.__jackAppBooted && !rootHasContent()) {
              showRecoveryHint();
            }
          }, 2800);
        }

        function showRecoveryHint() {
          if (document.getElementById('jack-boot-hint')) {
            return;
          }

          var hint = document.createElement('div');
          hint.id = 'jack-boot-hint';
          hint.style.position = 'fixed';
          hint.style.left = '50%';
          hint.style.bottom = '20px';
          hint.style.transform = 'translateX(-50%)';
          hint.style.zIndex = '99999';
          hint.style.padding = '10px 12px';
          hint.style.border = '1px solid rgba(255,255,255,0.28)';
          hint.style.borderRadius = '10px';
          hint.style.background = 'rgba(10,12,16,0.95)';
          hint.style.color = '#f2f4f8';
          hint.style.fontFamily = 'Arial, sans-serif';
          hint.style.fontSize = '13px';
          hint.style.maxWidth = 'calc(100vw - 24px)';
          hint.style.textAlign = 'center';

          var msg = document.createElement('span');
          msg.textContent = 'Page is taking longer than expected. ';

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Reload';
          btn.style.marginLeft = '6px';
          btn.style.padding = '4px 8px';
          btn.style.border = '1px solid rgba(255,255,255,0.3)';
          btn.style.borderRadius = '8px';
          btn.style.background = 'rgba(255,255,255,0.08)';
          btn.style.color = '#fff';
          btn.style.cursor = 'pointer';
          btn.onclick = function () {
            btn.disabled = true;
            btn.textContent = 'Retrying…';
            recoveryPromise = null;
            recoverCurrentBuild().then(function (started) {
              if (!started) {
                btn.disabled = false;
                btn.textContent = 'Try again';
                return;
              }
              finishRecovery(true);
            });
          };

          hint.appendChild(msg);
          hint.appendChild(btn);
          document.body.appendChild(hint);
        }

        window.__jackMarkBooted = function () {
          window.__jackAppBooted = true;
          var hint = document.getElementById('jack-boot-hint');
          if (hint && hint.parentNode) {
            hint.parentNode.removeChild(hint);
          }
        };

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var failedSrc = target && target.tagName === 'SCRIPT' ? target.getAttribute('src') : null;

          if (!failedSrc || failedSrc.indexOf('/static/js/main.') === -1 || rootHasContent()) {
            return;
          }

          recoverCurrentBuild().then(finishRecovery);
        }, true);

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (window.__jackAppBooted || rootHasContent()) {
              return;
            }

            recoverCurrentBuild().then(finishRecovery);
          }, 8000);
        });
      })();
    </script>
